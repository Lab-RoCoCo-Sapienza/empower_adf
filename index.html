        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #1e293b; /* slate-800 */
        }
        .task-button {
            transition: all 0.3s ease-in-out;
        }
        .task-button.active {
            background-color: #0284c7; /* sky-600 */
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .content-view {
            display: none;
        }
        .content-view.visible {
            display: block;
        }
        .plan-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .plan-table th, .plan-table td {
            border: 1px solid #e2e8f0; /* slate-200 */
            padding: 1rem;
            text-align: left;
            vertical-align: top;
            width: 50%;
        }
        .plan-table th {
            background-color: #f1f5f9; /* slate-100 */
            font-weight: 600;
        }
        .plan-content {
            background-color: #f8fafc; /* slate-50 */
            border: 1px solid #e2e8f0; /* slate-200 */
            padding: 1rem;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9em;
            border-radius: 0.5rem;
        }
        .conversation-step {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }
        .conversation-step:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: box-shadow 0.3s ease-in-out;
        }
        .reasoning-content {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            white-space: pre-wrap;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            border-radius: 0.5rem;
            line-height: 1.6;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .chat-message {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
        }
        .chat-message.human {
            justify-content: flex-end;
        }
        .chat-message.llm {
            justify-content: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: 1.5rem;
            position: relative;
            word-wrap: break-word;
        }
        .message-bubble.human {
            background-color: #3b82f6;
            color: white;
            border-bottom-right-radius: 0.375rem;
        }
        .message-bubble.llm {
            background-color: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .message-bubble.llm:hover {
            background-color: #e2e8f0;
            transform: translateY(-1px);
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.875rem;
            margin: 0 0.75rem;
            flex-shrink: 0;
        }
        .avatar.human {
            background-color: #3b82f6;
            color: white;
        }
        .avatar.llm {
            background-color: #10b981;
            color: white;
        }
        .reasoning-panel {
            display: none;
            margin-top: 0.75rem;
            margin-left: 44px;
            background-color: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 0.75rem;
            padding: 1rem;
            animation: slideDown 0.3s ease-out;
        }
        .reasoning-panel.visible {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .click-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
            opacity: 0.7;
        }
    </style>

            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            data.forEach(task => {
                const button = document.createElement('button');
                button.className = 'task-button p-6 bg-white rounded-lg shadow-md hover:shadow-xl hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500';
                button.innerHTML = `
                    <div class="flex flex-col items-center text-center">
                        <div class="p-3 bg-sky-100 rounded-full mb-4">

                        <h4 class="font-bold text-lg text-slate-800">${task.task_name}</h4>
                        <p class="text-sm text-slate-500 mt-1">${task.experiments.length} experiments</p>

                `;
                console.log(task.task_name)
                button.onclick = () => showExperiments(task);
                taskList.appendChild(button);
            });

        function showExperiments(task) {
            currentTask = task;
            tasksView.classList.remove('visible');
            detailsView.classList.remove('visible');
            experimentsView.classList.add('visible');
            
            document.getElementById('experiment-title').innerText = `Experiments for: ${task.task_name}`;
            const experimentList = document.getElementById('experiment-list');
            experimentList.innerHTML = '';
            task.experiments.forEach(exp => {
                const card = document.createElement('div');
                card.className = 'p-6 bg-white rounded-lg shadow-md hover:shadow-xl cursor-pointer transition-shadow';
                card.innerHTML = `<h3 class="font-semibold text-md text-slate-800">${exp.id}</h3>`;
                card.onclick = () => showDetails(task.task_id, exp);
                experimentList.appendChild(card);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            if (reasoningPanel) {
                reasoningPanel.classList.toggle('visible');
            }
        }

        backToTasksButton.onclick = () => {
            experimentsView.classList.remove('visible');
            tasksView.classList.add('visible');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        backToExperimentsButton.onclick = () => {
            detailsView.classList.remove('visible');
            experimentsView.classList.add('visible');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
